[project]
name = "app"
version = "0.1.0"
description = "My Project"
requires-python = ">=3.14"

dependencies = [
    "fastapi[standard]==0.141.1",
    "pydantic[email]",
    "pydantic-settings",
    "sqlmodel==0.0.39",
    "sqlalchemy[asyncio]",
    "alembic",
    "python-jose[cryptography]",
    "python-multipart",
    "aiosqlite>=0.22.1",
    "bcrypt>=5.0.0",
    "fastapi-mail>=1.6.2",
    "qrcode>=8.2",
    "pillow>=12.3.0",
]

[tool.setuptools]
packages = ["backend"]

[dependency-groups]
dev = [
    "mypy>=2.3.0",
    "prek>=0.4.11",
    "ruff>=0.16.1",
]

# ── Ruff (linter PEP8) ──────────────────────────────────────────────────────
[tool.ruff]
line-length = 88

[tool.ruff.lint]
select = ["E", "F", "I", "N", "W", "UP"]
ignore = ["E501"]

[tool.ruff.lint.isort]
known-first-party = ["app"]

# ── Ruff — format ────────────────────────────────────────────────────────────
[tool.ruff.format]
quote-style = "double"
indent-style = "space"
line-ending = "lf"

# ── Mypy (type checking) ─────────────────────────────────────────────────────
[tool.mypy]
python_version = "3.14"
strict = true
ignore_missing_imports = true
