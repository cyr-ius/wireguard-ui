site_name: WireGuard UI — Documentation
site_description: Technical documentation for WireGuard UI (FastAPI backend + Angular frontend)
site_author: cyr-ius
repo_url: https://github.com/cyr-ius/wireguard-ui
repo_name: cyr-ius/wireguard-ui
docs_dir: docs

theme:
  name: material
  language: en
  palette:
    - media: "(prefers-color-scheme: light)"
      scheme: default
      primary: indigo
      accent: indigo
      toggle:
        icon: material/weather-night
        name: Switch to dark mode
    - media: "(prefers-color-scheme: dark)"
      scheme: slate
      primary: indigo
      accent: indigo
      toggle:
        icon: material/weather-sunny
        name: Switch to light mode
  features:
    - navigation.tabs
    - navigation.sections
    - navigation.top
    - navigation.indexes
    - content.code.copy
    - content.code.annotate
    - toc.follow
    - search.suggest
    - search.highlight

plugins:
  - search
  - i18n:
      docs_structure: suffix
      reconfigure_material: true
      reconfigure_search: true
      languages:
        - locale: en
          name: English
          build: true
          default: true
        - locale: fr
          name: Français
          build: true
          nav_translations:
            Home: Accueil
            Getting started: Démarrage
            Quick start (Docker): Démarrage rapide (Docker)
            Local installation (dev): Installation locale (dev)
            Environment variables: Variables d'environnement
            Architecture: Architecture
            Backend (FastAPI): Backend (FastAPI)
            Frontend (Angular): Frontend (Angular)
            Database & migrations: Base de données & migrations
            Functions & API: Fonctions & API
            Routers (endpoints): Routers (endpoints)
            Business services: Services métier
            Authentication & security: Authentification & sécurité
            Deployment: Déploiement
            Docker & Docker Compose: Docker & Docker Compose
            Production recommendations: Recommandations production

markdown_extensions:
  - admonition
  - pymdownx.details
  - pymdownx.superfences:
      custom_fences:
        - name: mermaid
          class: mermaid
          format: !!python/name:pymdownx.superfences.fence_code_format
  - pymdownx.highlight:
      anchor_linenums: true
  - pymdownx.inlinehilite
  - pymdownx.tabbed:
      alternate_style: true
  - tables
  - toc:
      permalink: true
      toc_depth: 3

nav:
  - Home: index.md
  - Getting started:
      - Quick start (Docker): demarrage/quickstart-docker.md
      - Local installation (dev): demarrage/installation-locale.md
      - Environment variables: demarrage/variables-environnement.md
  - Architecture:
      - Backend (FastAPI): architecture/backend.md
      - Frontend (Angular): architecture/frontend.md
      - Database & migrations: architecture/base-de-donnees.md
  - Functions & API:
      - Routers (endpoints): fonctions/routers.md
      - Business services: fonctions/services.md
      - Authentication & security: fonctions/authentification.md
  - Deployment:
      - Docker & Docker Compose: deploiement/docker.md
      - Production recommendations: deploiement/production.md
